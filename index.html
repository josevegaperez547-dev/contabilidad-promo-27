<style>
:root{
  --ink-900:#111827;
  --ink-850:#161f33;
  --ink-800:#1b2540;
  --ink-700:#28325020;
  --paper:#FBF8F1;
  --paper-2:#F3EEDF;
  --line:#DFD8C1;
  --line-soft:#EAE4D3;
  --gold:#C9A227;
  --gold-dark:#9C7D1A;
  --gold-soft:#EFE0AE;
  --forest:#2F6F4E;
  --forest-soft:#DCEBE1;
  --rose:#B23A48;
  --rose-soft:#F4DBDD;
  --amber:#B8791A;
  --amber-soft:#F3E3C4;
  --muted:#8B90A0;
  --ink-text:#1C2333;
  --paper-text:#F4F1E6;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --radius:10px;
  --shadow: 0 1px 2px rgba(17,24,39,.06), 0 8px 24px rgba(17,24,39,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1200px 600px at 100% -10%, #1c2847 0%, transparent 60%),
    linear-gradient(180deg, var(--ink-900) 0%, var(--ink-850) 100%);
  color:var(--paper-text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1180px;margin:0 auto;padding:20px 16px 64px;}

/* ---------- Header ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:6px 2px 18px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .tassel{font-size:22px;transform:translateY(1px);}
.brand h1{
  font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.2px;
  margin:0;color:var(--paper-text);
}
.brand .sub{color:var(--muted);font-size:12.5px;letter-spacing:.3px;}
.sync{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--forest);display:inline-block;}
.sync .dot.saving{background:var(--amber);animation:pulse 1s infinite;}
.sync .dot.error{background:var(--rose);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{
  background:transparent;border:1px solid #3A466B;color:var(--paper-text);
  border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;
  font-family:var(--font-body);display:inline-flex;align-items:center;gap:6px;
}
.iconbtn:hover{border-color:var(--gold);color:var(--gold);}

/* ---------- Nav tabs (folder tabs) ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin;}
.tab{
  font-family:var(--font-body);font-weight:600;font-size:13.5px;
  color:var(--muted);background:transparent;border:none;
  padding:10px 16px 12px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;position:relative;top:1px;
}
.tab:hover{color:var(--paper-text);}
.tab.active{
  color:var(--ink-900);background:var(--paper);
  border-radius:10px 10px 0 0;border-bottom:2px solid var(--gold);
}

/* ---------- Card / paper surfaces ---------- */
.sheet{
  background:var(--paper);color:var(--ink-text);border-radius:0 10px 10px 10px;
  box-shadow:var(--shadow);padding:22px;position:relative;
}
.sheet + .sheet{margin-top:16px;}
.card{
  background:var(--paper);color:var(--ink-text);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;
}

/* ---------- Ledger stub hero ---------- */
.stub{
  background:var(--paper);color:var(--ink-text);border-radius:12px;
  box-shadow:var(--shadow); padding:22px 26px; margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;
  position:relative; overflow:hidden;
  border:1px dashed var(--line);
}
.stub::before, .stub::after{
  content:"";position:absolute;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;background:var(--ink-850);
}
.stub::before{left:-11px;} .stub::after{right:-11px;}
.stub .label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:600;}
.stub .value{font-family:var(--font-mono);font-weight:600;font-size:34px;color:var(--ink-900);}
.stub .value.big{font-size:40px;color:var(--forest);}
.stub .mini{display:flex;gap:28px;flex-wrap:wrap;}
.stub .mini .item .value{font-size:20px;color:var(--ink-900);}

/* ---------- KPI grid ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:820px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;}
.kpi .v{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:4px;color:var(--ink-900);}
.kpi .v.accent-A{color:#9C7D1A;} .kpi .v.accent-B{color:#3E6A80;} .kpi .v.accent-C{color:#7A4F73;} .kpi .v.accent-D{color:#4C7645;}

.charts-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:820px){.charts-row{grid-template-columns:1fr;}}
.chart-card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.chart-card h3{font-family:var(--font-display);font-size:16px;margin:0 0 12px;color:var(--ink-900);font-weight:600;}
.chart-wrap{position:relative;height:220px;}

h2.sheet-title{font-family:var(--font-display);font-size:20px;margin:0 0 4px;color:var(--ink-900);font-weight:600;}
.sheet-sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;}

/* ---------- Table ---------- */
.table-scroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px;}
table.ledger{border-collapse:collapse;width:100%;min-width:820px;font-size:13px;}
table.ledger th{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  text-align:right;padding:10px 8px;background:var(--paper-2);border-bottom:1px solid var(--line);
  font-weight:600;position:sticky;top:0;
}
table.ledger th.left, table.ledger td.left{text-align:left;}
table.ledger td{padding:6px 6px;border-bottom:1px solid var(--line-soft);text-align:right;vertical-align:middle;}
table.ledger tr:last-child td{border-bottom:none;}
table.ledger td.name-cell, table.ledger th.name-th{
  position:sticky;left:0;background:var(--paper);min-width:190px;text-align:left;
  box-shadow:1px 0 0 var(--line-soft);
}
table.ledger th.name-th{background:var(--paper-2);}
table.ledger tr.row-full .name-cell{border-left:3px solid var(--forest);}
table.ledger tr.row-partial .name-cell{border-left:3px solid var(--amber);}
table.ledger tr.row-none .name-cell{border-left:3px solid var(--line);}

.cell-input{
  width:100%;border:1px solid transparent;background:transparent;
  font-family:var(--font-mono);font-size:12.8px;text-align:right;padding:6px 5px;
  border-radius:6px;color:var(--ink-text);
}
.cell-input:hover{border-color:var(--line);}
.cell-input:focus{outline:none;border-color:var(--gold);background:#fff;}
input.name-input{font-family:var(--font-body);font-weight:500;text-align:left;font-size:13px;}
input.obs-input{font-family:var(--font-body);text-align:left;font-size:12.3px;color:#555;min-width:170px;}
.total-cell{font-family:var(--font-mono);font-weight:600;}
.total-cell.full{color:var(--forest);}
.total-cell.partial{color:var(--amber-dark, #8a5a10);}
.total-cell.none{color:var(--muted);}

.row-actions{display:flex;gap:4px;justify-content:center;}
.mini-btn{
  border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;
  padding:4px 6px;cursor:pointer;color:var(--ink-text);font-family:var(--font-body);
}
.mini-btn:hover{border-color:var(--gold);color:var(--gold-dark);}
.mini-btn.danger:hover{border-color:var(--rose);color:var(--rose);}

tfoot td{font-family:var(--font-mono);font-weight:700;background:var(--paper-2);padding:9px 8px;border-top:2px solid var(--line);}

.add-row-form{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;}
.add-row-form input{
  font-family:var(--font-body);font-size:13px;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--ink-text);
}
.add-row-form input[type=text]{min-width:220px;flex:1;}
.add-row-form input[type=number]{width:120px;}
.add-row-form input[type=date]{width:150px;}
.btn-primary{
  background:var(--ink-900);color:var(--paper-text);border:none;border-radius:7px;
  padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);
}
.btn-primary:hover{background:var(--gold-dark);}

.section-meta-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:14px;}
.aporte-field{display:flex;flex-direction:column;gap:4px;}
.aporte-field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
.aporte-field input{font-family:var(--font-mono);font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;width:140px;}
.search-field input{font-family:var(--font-body);font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;width:200px;}
.progress-mini{font-size:12px;color:var(--muted);}

.debt-table td, .debt-table th{padding:8px 6px;}
.badge{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;
  color:#fff;letter-spacing:.3px;
}

.undo-toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,120%);
  background:var(--ink-900);color:var(--paper-text);padding:12px 18px;border-radius:9px;
  box-shadow:var(--shadow);font-size:13px;display:flex;gap:14px;align-items:center;
  transition:transform .25s ease; z-index:50;
}
.undo-toast.show{transform:translate(-50%,0);}
.undo-toast button{
  background:var(--gold);color:var(--ink-900);border:none;border-radius:6px;padding:6px 10px;
  font-weight:700;font-size:12px;cursor:pointer;
}
.footnote{color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.5;}
.empty-note{color:var(--muted);font-size:13px;padding:20px 4px;}

@media(max-width:600px){
  .brand h1{font-size:21px;}
  .stub{padding:18px;}
  .stub .value.big{font-size:30px;}
}
.setup-banner{
  max-width:1180px;margin:0 auto;background:#fff4d6;color:#5a4200;border:1px solid #e3c467;
  border-radius:10px;padding:16px 20px;font-size:13.5px;line-height:1.6;
}
.setup-banner code{background:#fffaf0;padding:1px 5px;border-radius:4px;font-family:var(--font-mono);font-size:12.5px;}
.setup-banner a{color:#5a4200;font-weight:700;}
</style>
</head>

  }
  render();

  // Escucha en tiempo real: si alguien más del comité guarda algo, se refleja aquí solo.
  docRef.onSnapshot((snap)=>{
    if(!snap.exists) return;
    const active = document.activeElement;
    const isEditing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    if(isEditing) return;
    STATE = snap.data();
    render();
  }, (err)=>{
    console.error('firestore listen error', err);
    setSyncStatus('error');
  });
}

async function persist(){
  if(!FIREBASE_CONFIGURED) return;
  setSyncStatus('saving');
  try{
    await docRef.set(STATE);
    setSyncStatus('ok');
  }catch(e){
    console.error('save error', e);
    setSyncStatus('error');
  }
}
function queueSave(){
  if(!FIREBASE_CONFIGURED) return;
  clearTimeout(saveTimer);
  setSyncStatus('saving');
  saveTimer = setTimeout(persist, 350);
}
function setSyncStatus(s){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if(!dot) return;
  dot.className = 'dot' + (s==='saving' ? ' saving' : s==='error' ? ' error' : '');
  label.textContent = s==='saving' ? 'Guardando…' : s==='error' ? 'Error al guardar' : 'Guardado · datos compartidos con el comité';
}

async function refreshFromRemote(silent){
  if(!FIREBASE_CONFIGURED) return;
  try{
    const snap = await docRef.get({source:'server'});
    if(snap.exists){
      STATE = snap.data();
      render();
      if(!silent) flashSynced();
    }
  }catch(e){ console.error(e); }
}
function flashSynced(){
  const label = document.getElementById('syncLabel');
  if(!label) return;
  const prev = label.textContent;
  label.textContent = 'Actualizado ✓';
  setTimeout(()=>{ if(label) label.textContent = prev; }, 1500);
}

/* ---------------- Computations ---------------- */
function studentTotal(s){
  return Object.values(s.payments||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function sectionRaised(letter){
  const sec = STATE.sections[letter];
  return sec.students.reduce((sum,s)=>sum+studentTotal(s),0);
}
function sectionTotal(letter){
  const sec = STATE.sections[letter];
  return sectionRaised(letter) + (Number(sec.aporteBase)||0);
}
function totalRecaudado(){
  return SECTION_LETTERS.reduce((sum,l)=>sum+sectionTotal(l),0);
}
function totalGastos(){
  return STATE.gastos.reduce((sum,g)=>sum+(Number(g.monto)||0),0);
}
function totalDepositado(){
  return STATE.depositos.reduce((sum,d)=>sum+(Number(d.cantidad)||0),0);
}
function targetPerStudent(){
  return STATE.quota * STATE.months.length;
}
function balance(){
  return totalRecaudado() - totalGastos();
}

/* ---------------- Rendering ---------------- */
function render(){
  renderTopbar();
  renderTabs();
  const main = document.getElementById('main');
  if(!main) return;
  if(currentTab === 'resumen') main.innerHTML = viewResumen();
  else if(SECTION_LETTERS.includes(currentTab)) main.innerHTML = viewSection(currentTab);
  else if(currentTab === 'gastos') main.innerHTML = viewGastos();
  else if(currentTab === 'depositos') main.innerHTML = viewDepositos();
  if(currentTab === 'resumen') setTimeout(drawCharts, 0);
}

function renderTopbar(){
  const bal = document.getElementById('syncLabel');
  // topbar itself is static in shell; nothing dynamic beyond sync dot which persists.
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  if(!nav) return;
  const tabs = [
    ['resumen','Resumen'],
    ['A','5to A'], ['B','5to B'], ['C','5to C'], ['D','5to D'],
    ['gastos','Gastos'], ['depositos','Depósitos']
  ];
  nav.innerHTML = tabs.map(([id,label])=>
    `<button class="tab ${currentTab===id?'active':''}" data-action="switch-tab" data-tab="${id}">${label}</button>`
  ).join('');
}

function statusClass(total){
  const target = targetPerStudent();
  if(total >= target) return 'full';
  if(total > 0) return 'partial';
  return 'none';
}

/* ---- Resumen ---- */
function viewResumen(){
  const rec = totalRecaudado();
  const gas = totalGastos();
  const dep = totalDepositado();
  const bal = balance();
  const pendienteDepositar = rec - dep;

  const secCards = SECTION_LETTERS.map(l=>{
    const sec = STATE.sections[l];
    const total = sectionTotal(l);
    const n = sec.students.length;
    const paidCount = sec.students.filter(s=>studentTotal(s) >= targetPerStudent()).length;
    return `<div class="kpi">
      <div class="l">${sec.label}</div>
      <div class="v accent-${l}">${fmt(total)}</div>
      <div class="progress-mini">${paidCount}/${n} completaron su cuota</div>
    </div>`;
  }).join('');

  const target = targetPerStudent();
  const debtors = [];
  SECTION_LETTERS.forEach(l=>{
    STATE.sections[l].students.forEach(s=>{
      const t = studentTotal(s);
      const debt = target - t;
      if(debt > 0) debtors.push({name:s.name, section:l, total:t, debt});
    });
  });
  debtors.sort((a,b)=>b.debt-a.debt);
  const topDebtors = debtors.slice(0,12);

  const debtorsRows = topDebtors.length ? topDebtors.map(d=>`
    <tr>
      <td class="left">${escapeHtml(d.name)}</td>
      <td class="left"><span class="badge" style="background:${SECTION_COLORS[d.section]}">${d.section}</span></td>
      <td>${fmt(d.total)}</td>
      <td style="color:var(--rose);font-weight:600;">${fmt(d.debt)}</td>
    </tr>`).join('') : `<tr><td colspan="4" class="empty-note">Nadie tiene cuenta pendiente. 🎉</td></tr>`;

  return `
    <div class="stub">
      <div>
        <div class="label">Balance en caja</div>
        <div class="value big">${fmt(bal)}</div>
      </div>
      <div class="mini">
        <div class="item"><div class="label">Recaudado</div><div class="value">${fmt(rec)}</div></div>
        <div class="item"><div class="label">Gastos</div><div class="value" style="color:var(--rose)">${fmt(gas)}</div></div>
        <div class="item"><div class="label">Depositado en banco</div><div class="value">${fmt(dep)}</div></div>
        <div class="item"><div class="label">Pendiente por depositar</div><div class="value">${fmt(Math.max(0,pendienteDepositar))}</div></div>
      </div>
    </div>

    <div class="kpi-grid">${secCards}</div>

    <div class="charts-row">
      <div class="chart-card">
        <h3>Recaudado por sección</h3>
        <div class="chart-wrap"><canvas id="chartSecciones"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Gastos vs. balance disponible</h3>
        <div class="chart-wrap"><canvas id="chartBalance"></canvas></div>
      </div>
    </div>

    <div class="sheet">
      <h2 class="sheet-title">Cuentas pendientes</h2>
      <div class="sheet-sub">Estudiantes con mayor deuda respecto a la cuota total de ${fmt(target)} (${STATE.months.length} meses × ${fmt(STATE.quota)})</div>
      <div class="table-scroll">
        <table class="ledger debt-table" style="min-width:480px;">
          <thead><tr><th class="left">Nombre</th><th class="left">Sección</th><th>Pagado</th><th>Debe</th></tr></thead>
          <tbody>${debtorsRows}</tbody>
        </table>
      </div>
      <div class="footnote">Los gastos itemizados suman ${fmt(gas)}. Verifica el resumen original si esperabas otra cifra: la pestaña "Resumen general" del Excel mostraba RD$60,443 en gastos, pero la lista detallada de la pestaña "Gastos" solo sumaba RD$44,449 — usa la pestaña Gastos de esta app para mantenerlos alineados.</div>
    </div>
  `;
}

function drawCharts(){
  if(typeof Chart === 'undefined'){
    ['chartSecciones','chartBalance'].forEach(id=>{
      const c = document.getElementById(id);
      if(c) c.parentElement.innerHTML = '<div class="empty-note">No se pudo cargar la librería de gráficos (revisa tu conexión y recarga la página).</div>';
    });
    return;
  }
  const c1 = document.getElementById('chartSecciones');
  const c2 = document.getElementById('chartBalance');
  if(charts.secciones){ charts.secciones.destroy(); }
  if(charts.balance){ charts.balance.destroy(); }
  if(c1){
    charts.secciones = new Chart(c1, {
      type:'bar',
      data:{
        labels: SECTION_LETTERS.map(l=>STATE.sections[l].label),
        datasets:[{
          data: SECTION_LETTERS.map(l=>sectionTotal(l)),
          backgroundColor: SECTION_LETTERS.map(l=>SECTION_COLORS[l]),
          borderRadius:6, maxBarThickness:56
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>fmt(ctx.raw)}}},
        scales:{ y:{ ticks:{ callback:(v)=>'RD$'+Number(v).toLocaleString('es-DO') }, grid:{color:'#EAE4D3'} }, x:{grid:{display:false}} }
      }
    });
  }
  if(c2){
    const gas = totalGastos(); const bal = Math.max(0, balance());
    charts.balance = new Chart(c2, {
      type:'doughnut',
      data:{
        labels:['Gastos','Balance disponible'],
        datasets:[{ data:[gas, bal], backgroundColor:['#B23A48','#2F6F4E'], borderWidth:0 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'68%',
        plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}, tooltip:{callbacks:{label:(ctx)=>ctx.label+': '+fmt(ctx.raw)}} }
      }
    });
  }
}

/* ---- Sección ---- */
function viewSection(letter){
  const sec = STATE.sections[letter];
  const target = targetPerStudent();
  const paidCount = sec.students.filter(s=>studentTotal(s) >= target).length;

  const monthHeaders = STATE.months.map(m=>`<th>${MONTH_LABELS[m]||m}</th>`).join('');

  const rows = sec.students.map(s=>{
    const total = studentTotal(s);
    const cls = statusClass(total);
    const monthCells = STATE.months.map(m=>{
      const val = s.payments[m];
      return `<td><input class="cell-input pay-input" type="number" inputmode="decimal" min="0" step="1"
        data-section="${letter}" data-student="${s.id}" data-month="${m}"
        value="${val!=null?val:''}" placeholder="—"></td>`;
    }).join('');
    return `<tr class="row-${cls}">
      <td class="name-cell"><input class="cell-input name-input" type="text" data-section="${letter}" data-student="${s.id}" data-field="name" value="${escapeAttr(s.name)}"></td>
      ${monthCells}
      <td class="total-cell ${cls}">${fmt(total)}</td>
      <td><input class="cell-input obs-input" type="text" data-section="${letter}" data-student="${s.id}" data-field="obs" value="${escapeAttr(s.obs||'')}" placeholder="—"></td>
      <td>
        <div class="row-actions">
          <button class="mini-btn" data-action="fill-quota" data-section="${letter}" data-student="${s.id}" title="Completar meses vacíos con la cuota">✓ todo</button>
          <button class="mini-btn danger" data-action="delete-student" data-section="${letter}" data-student="${s.id}" title="Eliminar estudiante">✕</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="sheet">
      <div class="section-meta-row">
        <div>
          <h2 class="sheet-title">${sec.label}</h2>
          <div class="sheet-sub">${sec.students.length} estudiantes · ${paidCount} completaron su cuota de ${fmt(target)} · Total sección: <strong>${fmt(sectionTotal(letter))}</strong></div>
        </div>
        <div class="aporte-field">
          <label>Aporte base (fondos previos)</label>
          <input type="number" min="0" step="1" class="aporte-input" data-section="${letter}" value="${sec.aporteBase||0}">
        </div>
      </div>
      <div class="table-scroll">
        <table class="ledger">
          <thead>
            <tr>
              <th class="left name-th">Nombre</th>
              ${monthHeaders}
              <th>Total</th>
              <th class="left">Observaciones</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="${STATE.months.length+4}" class="empty-note">Aún no hay estudiantes en esta sección.</td></tr>`}</tbody>
          <tfoot>
            <tr>
              <td class="left">TOTAL SECCIÓN</td>
              <td colspan="${STATE.months.length}"></td>
              <td>${fmt(sectionRaised(letter))}</td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <form class="add-row-form" data-action="add-student" data-section="${letter}">
        <input type="text" name="name" placeholder="Nombre del nuevo estudiante" required>
        <button class="btn-primary" type="submit">+ Agregar estudiante</button>
      </form>
    </div>
  `;
}

/* ---- Gastos ---- */
function viewGastos(){
  const rows = STATE.gastos.map(g=>`
    <tr>
      <td class="left"><input class="cell-input name-input" type="text" data-id="${g.id}" data-field="desc" value="${escapeAttr(g.desc)}"></td>
      <td><input class="cell-input pay-input" type="number" min="0" step="1" data-id="${g.id}" data-field="monto" value="${g.monto}"></td>
      <td><button class="mini-btn danger" data-action="delete-gasto" data-id="${g.id}">✕</button></td>
    </tr>`).join('');

  return `
    <div class="sheet">
      <h2 class="sheet-title">Gastos</h2>
      <div class="sheet-sub">Todo lo que se ha pagado con el fondo de la promoción</div>
      <div class="table-scroll">
        <table class="ledger" style="min-width:520px;">
          <thead><tr><th class="left">Descripción</th><th>Monto</th><th></th></tr></thead>
          <tbody id="gastosBody">${rows || `<tr><td colspan="3" class="empty-note">No hay gastos registrados todavía.</td></tr>`}</tbody>
          <tfoot><tr><td class="left">TOTAL</td><td>${fmt(totalGastos())}</td><td></td></tr></tfoot>
        </table>
      </div>
      <form class="add-row-form" data-action="add-gasto">
        <input type="text" name="desc" placeholder="Descripción del gasto" required>
        <input type="number" name="monto" placeholder="Monto RD$" min="0" step="1" required>
        <button class="btn-primary" type="submit">+ Agregar gasto</button>
      </form>
    </div>
  `;
}

/* ---- Depósitos ---- */
function viewDepositos(){
  const sorted = [...STATE.depositos].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const rows = sorted.map(d=>`
    <tr>
      <td><input class="cell-input" type="date" data-id="${d.id}" data-field="fecha" value="${d.fecha||''}" style="text-align:left;"></td>
      <td class="left"><input class="cell-input name-input" type="text" data-id="${d.id}" data-field="nombre" value="${escapeAttr(d.nombre)}"></td>
      <td><input class="cell-input pay-input" type="number" min="0" step="1" data-id="${d.id}" data-field="cantidad" value="${d.cantidad}"></td>
      <td><button class="mini-btn danger" data-action="delete-deposito" data-id="${d.id}">✕</button></td>
    </tr>`).join('');

  return `
    <div class="sheet">
      <h2 class="sheet-title">Depósitos al banco</h2>
      <div class="sheet-sub">Registro de entradas a la cuenta bancaria · Total depositado: <strong>${fmt(totalDepositado())}</strong> de ${fmt(totalRecaudado())} recaudado</div>
      <div class="table-scroll">
        <table class="ledger" style="min-width:560px;">
          <thead><tr><th class="left">Fecha</th><th class="left">Nombre</th><th>Cantidad</th><th></th></tr></thead>
          <tbody id="depositosBody">${rows || `<tr><td colspan="4" class="empty-note">No hay depósitos registrados todavía.</td></tr>`}</tbody>
          <tfoot><tr><td colspan="2" class="left">TOTAL</td><td>${fmt(totalDepositado())}</td><td></td></tr></tfoot>
        </table>
      </div>
      <form class="add-row-form" data-action="add-deposito">
        <input type="date" name="fecha" required>
        <input type="text" name="nombre" placeholder="Nombre de quien deposita" required>
        <input type="number" name="cantidad" placeholder="Cantidad RD$" min="0" step="1" required>
        <button class="btn-primary" type="submit">+ Agregar depósito</button>
      </form>
    </div>
  `;
}

/* ---------------- Helpers ---------------- */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function findStudent(letter, id){
  return STATE.sections[letter].students.find(s=>s.id===id);
}

/* ---------------- Undo ---------------- */
function withUndo(label, mutateFn){
  lastSnapshot = clone(STATE);
  mutateFn();
  queueSave();
  render();
  showUndo(label);
}
function showUndo(label){
  clearTimeout(undoTimer);
  const toast = document.getElementById('undoToast');
  toast.innerHTML = `${escapeHtml(label)} eliminado. <button id="undoBtn">Deshacer</button>`;
  toast.classList.add('show');
  document.getElementById('undoBtn').onclick = ()=>{
    if(lastSnapshot){ STATE = lastSnapshot; lastSnapshot=null; queueSave(); render(); }
    toast.classList.remove('show');
  };
  undoTimer = setTimeout(()=>toast.classList.remove('show'), 6000);
}

/* ---------------- Event wiring ---------------- */
function wireEvents(){
  const app = document.getElementById('app');

  app.addEventListener('change', (e)=>{
    const t = e.target;
    if(t.matches('.pay-input') && t.dataset.section){
      const s = findStudent(t.dataset.section, t.dataset.student);
      if(!s) return;
      const v = t.value === '' ? null : Number(t.value);
      if(v===null || v===0) delete s.payments[t.dataset.month];
      else s.payments[t.dataset.month] = v;
      queueSave(); render();
    } else if(t.matches('.name-input') && t.dataset.field==='name'){
      const s = findStudent(t.dataset.section, t.dataset.student);
      if(!s) return;
      s.name = t.value.trim() || s.name;
      queueSave();
    } else if(t.matches('.obs-input')){
      const s = findStudent(t.dataset.section, t.dataset.student);
      if(!s) return;
      s.obs = t.value.trim() || null;
      queueSave();
    } else if(t.matches('.aporte-input')){
      STATE.sections[t.dataset.section].aporteBase = Number(t.value)||0;
      queueSave(); render();
    } else if(t.dataset.id && t.dataset.field){
      // gastos / depositos inline edits
      const gastoRow = STATE.gastos.find(g=>g.id===t.dataset.id);
      const depRow = STATE.depositos.find(d=>d.id===t.dataset.id);
      if(gastoRow){
        if(t.dataset.field==='desc') gastoRow.desc = t.value.trim();
        if(t.dataset.field==='monto') gastoRow.monto = Number(t.value)||0;
        queueSave(); render();
      } else if(depRow){
        if(t.dataset.field==='nombre') depRow.nombre = t.value.trim();
        if(t.dataset.field==='cantidad') depRow.cantidad = Number(t.value)||0;
        if(t.dataset.field==='fecha') depRow.fecha = t.value;
        queueSave(); render();
      }
    }
  });

  app.addEventListener('submit', (e)=>{
    const form = e.target;
    if(form.dataset.action === 'add-student'){
      e.preventDefault();
      const letter = form.dataset.section;
      const input = form.querySelector('input[name=name]');
      const name = input.value.trim();
      if(!name) return;
      const sec = STATE.sections[letter];
      const id = letter + '-' + (Date.now()+Math.floor(Math.random()*1000));
      sec.students.push({id, name, payments:{}, obs:null});
      queueSave(); render();
      input.focus();
    } else if(form.dataset.action === 'add-gasto'){
      e.preventDefault();
      const desc = form.querySelector('[name=desc]').value.trim();
      const monto = Number(form.querySelector('[name=monto]').value)||0;
      if(!desc) return;
      STATE.gastos.push({id:'g'+Date.now(), desc, monto});
      queueSave(); render();
    } else if(form.dataset.action === 'add-deposito'){
      e.preventDefault();
      const fecha = form.querySelector('[name=fecha]').value;
      const nombre = form.querySelector('[name=nombre]').value.trim();
      const cantidad = Number(form.querySelector('[name=cantidad]').value)||0;
      if(!nombre) return;
      STATE.depositos.push({id:'d'+Date.now(), fecha, nombre, cantidad});
      queueSave(); render();
    }
  });

  app.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    if(action === 'switch-tab'){
      currentTab = btn.dataset.tab;
      render();
    } else if(action === 'fill-quota'){
      const s = findStudent(btn.dataset.section, btn.dataset.student);
      if(!s) return;
      STATE.months.forEach(m=>{ if(s.payments[m]==null) s.payments[m] = STATE.quota; });
      queueSave(); render();
    } else if(action === 'delete-student'){
      const letter = btn.dataset.section;
      const sec = STATE.sections[letter];
      const s = findStudent(letter, btn.dataset.student);
      if(!s) return;
      withUndo('Estudiante', ()=>{
        sec.students = sec.students.filter(x=>x.id!==s.id);
      });
    } else if(action === 'delete-gasto'){
      withUndo('Gasto', ()=>{ STATE.gastos = STATE.gastos.filter(g=>g.id!==btn.dataset.id); });
    } else if(action === 'delete-deposito'){
      withUndo('Depósito', ()=>{ STATE.depositos = STATE.depositos.filter(d=>d.id!==btn.dataset.id); });
    } else if(action === 'refresh'){
      refreshFromRemote(false);
    }
  });
}

/* ---------------- Boot ---------------- */
function boot(){
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="brand">
        <span class="tassel">🎓</span>
        <div>
          <h1>Promo 27</h1>
          <div class="sub">Contabilidad de pagos</div>
        </div>
      </div>
      <div class="sync">
        <span class="dot" id="syncDot"></span>
        <span id="syncLabel">Cargando…</span>
        <button class="iconbtn" data-action="refresh">↻ Actualizar</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div id="main"></div>
  `;
  wireEvents();
  loadState();
  // Red de seguridad: si vuelves a la pestaña después de un rato, confirma con el servidor.
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshFromRemote(true); });
}
boot();
